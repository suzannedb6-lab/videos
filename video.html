<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  video { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
</style>
</head>
<body>
<video id="v" autoplay muted loop playsinline preload="auto"></video>
<script>
  // Utilisation : video.html?v=nom-de-la-video.mp4  (option : &fit=contain pour ne pas recadrer)
  var p = new URLSearchParams(location.search);
  var v = document.getElementById('v');
  if (p.get('fit') === 'contain') v.style.objectFit = 'contain';
  v.src = p.get('v') || 'video.mp4';
  v.muted = true;
  var play = function () { var r = v.play(); if (r && r.catch) r.catch(function () {}); };
  v.addEventListener('canplay', play);
  play();
</script>
</body>
</html>
