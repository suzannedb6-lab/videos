<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ikea</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: pointer; }
  video { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #s { position: fixed; right: 12px; bottom: 12px; width: 38px; height: 38px; border: 0; border-radius: 50%;
       background: rgba(0,0,0,.5); color: #fff; cursor: pointer; padding: 0;
       display: flex; align-items: center; justify-content: center; }
  #s svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<video id="v" src="videoIkea.mp4" autoplay muted loop playsinline preload="auto"></video>
<button id="s" aria-label="Activer le son"></button>
<script>
  var v = document.getElementById('v');
  var b = document.getElementById('s');
  var off = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  var on  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  b.innerHTML = off;
  v.muted = true;
  var play = function () { var r = v.play(); if (r && r.catch) r.catch(function () {}); };
  v.addEventListener('canplay', play);
  play();
  document.addEventListener('click', function () {
    v.muted = !v.muted;
    b.innerHTML = v.muted ? off : on;
    b.setAttribute('aria-label', v.muted ? 'Activer le son' : 'Couper le son');
    play();
  });
</script>
</body>
</html>
